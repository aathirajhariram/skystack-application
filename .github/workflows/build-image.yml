# Builds the SkyStack API image on GitHub and pushes it to GitHub Container Registry (ghcr.io).
# Runs on every push that changes portal_auth/, or by hand: Actions tab, "build-api-image", Run workflow.
name: build-api-image

on:
  push:
    branches: [main]
    paths: ["portal_auth/**", ".github/workflows/build-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner name (ghcr.io needs lowercase)
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./portal_auth
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/skystack-portal:latest
            ghcr.io/${{ env.OWNER }}/skystack-portal:${{ github.run_number }}
